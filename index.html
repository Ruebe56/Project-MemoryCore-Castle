<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MemoryCore Castle</title>
    <!-- The start-up screen: plain HTML and CSS, so it is on screen before any script has loaded.
         src/loader/loader.js tells it what is loading and removes it when Castle is ready.
         Its picture is public/loader/loader.webp (16:9; see public/loader/README.md). -->
    <link rel="stylesheet" href="/loader/loader.css" />
  </head>
  <body>
    <div id="castle-loader" role="status" aria-live="polite">
      <div class="art"></div>
      <div class="shade"></div>
      <div class="version" id="castle-loader-version"></div>
      <div class="panel">
        <div class="brand">MEMORYCORE CASTLE</div>
        <div class="quip" id="castle-loader-quip">Waking the castle…</div>
        <div class="bar"><i id="castle-loader-bar"></i></div>
        <div class="status"><span id="castle-loader-step">Starting up</span><code id="castle-loader-file"></code></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
